name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      authentication:
        description: Publication authentication (register Trusted Publisher first)
        type: choice
        options: [trusted-publishing, api-token]
        default: trusted-publishing
        required: true
  push:
    branches: ["release/pypi-*"]

permissions:
  contents: read

concurrency:
  group: pypi-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Validate distributions and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check PyPI token is configured
        if: github.event_name == 'push' || inputs.authentication == 'api-token'
        env:
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::error::Add the PyPI API token as the repository Actions secret TWINE_PASSWORD."
            exit 1
          fi
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Test with at least 95 percent coverage
        run: python -m pytest --cov=whyempty --cov-report=term-missing --cov-fail-under=95
      - name: Check lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Check types
        run: python -m mypy
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Publish through PyPI Trusted Publishing
        if: github.event_name == 'workflow_dispatch' && inputs.authentication == 'trusted-publishing'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      - name: Upload distributions to PyPI with the migration token
        if: github.event_name == 'push' || inputs.authentication == 'api-token'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        run: >-
          python -m twine upload --non-interactive
          --repository-url https://upload.pypi.org/legacy/ dist/*
