name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest --cov=whyempty --cov-report=term-missing
      - run: python examples/basic_usage.py
      - run: python examples/audit_usage.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Inspect distribution contents and runtime dependencies
        run: |
          python - <<'PY'
          import email
          import tarfile
          import tomllib
          import zipfile
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == len(sdists) == 1, "Expected exactly one wheel and one sdist"
          wheel, sdist = wheels[0], sdists[0]
          package_root = Path("src/whyempty")
          required = {
              path.relative_to(package_root).as_posix()
              for path in package_root.rglob("*.py")
          } | {"py.typed"}
          with zipfile.ZipFile(wheel) as archive:
              files = set(archive.namelist())
              assert all(f"whyempty/{name}" in files for name in required)
              assert any(name.endswith("/licenses/LICENSE") for name in files)
              metadata_name = next(name for name in files if name.endswith("/METADATA"))
              metadata = email.message_from_bytes(archive.read(metadata_name))
              assert metadata["Version"] == project["version"]
              assert metadata["Requires-Python"] == project["requires-python"]
              assert all(
                  "extra ==" in requirement
                  for requirement in metadata.get_all("Requires-Dist", [])
              ), "Unexpected required runtime dependency"
          with tarfile.open(sdist) as archive:
              files = set(archive.getnames())
              prefix = f"whyempty-{project['version']}/"
              assert all(prefix + "src/whyempty/" + name in files for name in required)
              required_source = [
                  "LICENSE", "README.md", "pyproject.toml", "CONTRIBUTING.md", "CHANGELOG.md",
                  "examples/basic_usage.py", "examples/audit_usage.py", "benchmarks/benchmark.py",
                  "benchmarks/results.json", "docs/design.md",
              ]
              assert all(prefix + name in files for name in required_source)
          PY
      - name: Install wheel and exercise installed package
        run: |
          python -m venv /tmp/whyempty-wheel
          /tmp/whyempty-wheel/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/whyempty-wheel/bin/python - <<'PY'
          from importlib.metadata import version

          from whyempty import Pipeline, __version__, trace

          assert __version__ == version("whyempty")
          result = trace([1, 2]).keep("none", lambda value: False)
          assert result.count == 0
          assert "EMPTY" in result.explain()
          pipeline = (
              Pipeline[int]()
              .keep("even", lambda value: value % 2 == 0)
              .keep("odd", lambda value: value % 2 != 0)
          )
          assert pipeline.run([1, 2]).is_empty
          audit = pipeline.audit([1, 2])
          assert audit.relax(1).remaining == 1
          assert audit.matching_indices(without=(1,)) == (0,)
          assert audit.failed_filters(0)[0].index == 1
          assert len(audit.suggest_relaxations()) == 2
          PY
      - name: Build an installable wheel from the sdist
        run: python -m pip wheel --no-deps --wheel-dir /tmp/whyempty-from-sdist dist/*.tar.gz
